name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit # TODO: switch to 'block' once the audited egress list is reviewed
          disable-sudo: true

      # The version-sync commit has to reach main directly, which the branch ruleset
      # forbids. The releaser app is a bypass actor on that ruleset, so the push must
      # authenticate as the app rather than as github-actions[bot].
      - name: Mint releaser app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # fetch-depth: 0 so semantic-release can read the full history to derive the next version
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@7.0.2
            @semantic-release/exec@6.0.3
            @semantic-release/git@10.0.1
