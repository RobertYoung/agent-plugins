name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit # TODO: switch to 'block' once the audited egress list is reviewed
          disable-sudo: true

      # Only when @semantic-release/git pushes a version commit to a protected branch.
      # The push must authenticate as the app that holds the ruleset bypass, so uncomment
      # this step and swap both token references below for its output.
      # - name: Mint releaser app token
      #   id: app-token
      #   uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #   with:
      #     app-id: ${{ vars.RELEASE_APP_ID }}
      #     private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # fetch-depth: 0 so semantic-release can read the full history to derive the next version
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          # token: ${{ steps.app-token.outputs.token }}

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # steps.app-token.outputs.token when pushing to a protected branch
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@7.0.2
